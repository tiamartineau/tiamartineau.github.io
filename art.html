<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive sketchbook of paintings and studies by Tia Martineau.">
  <meta name="theme-color" content="#101010">
  <title>Art · Tia Martineau</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="art-notebook.css">
  <script src="art-notebook.js" defer></script>
</head>
<body class="art-page notebook-site">
  <header class="site-header art-header">
    <a class="wordmark" href="index.html">TIA MARTINEAU</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="science.html">Science</a>
      <a href="teaching.html">Teaching</a>
      <a href="art.html" aria-current="page">Art</a>
    </nav>
  </header>

  <main class="notebook-main">
    <div class="notebook-heading">
      <h1>Art</h1>
      <p class="notebook-hint">Turn the pages to explore.</p>
    </div>

    <section class="book-section" aria-label="Interactive sketchbook portfolio">
      <div class="book-desk">
        <div class="book" id="book">
          <div class="book-cover" id="bookCover" role="button" tabindex="0" aria-label="Open sketchbook">
            <div class="cover-spine" aria-hidden="true"></div>
            <div class="cover-elastic" aria-hidden="true"></div>
            <div class="cover-label" aria-hidden="true">T. M.</div>
          </div>

          <div class="book-open" id="bookOpen" hidden>
            <div class="book-pages" id="bookPages">
              <article class="paper-page left-page" id="leftPage"></article>
              <article class="paper-page right-page" id="rightPage"></article>
              <div class="book-gutter" aria-hidden="true"></div>
              <div class="page-turn-layer" id="turnLayer" aria-hidden="true">
                <div class="turn-face turn-front" id="turnFront"></div>
                <div class="turn-face turn-back" id="turnBack"></div>
              </div>
            </div>
            <span class="book-ribbon" aria-hidden="true"></span>
          </div>

          <img class="desk-pencil-image" src="assets/img/notebook/apple_pencil.png" alt="" aria-hidden="true">
        </div>
      </div>

      <div class="book-toolbar">
        <button class="book-arrow" id="prevPage" type="button" aria-label="Previous page"><span aria-hidden="true">←</span> <span>Previous</span></button>
        <div class="book-progress" aria-live="polite" aria-atomic="true">
          <span class="book-progress-label" id="bookProgress">Cover</span>
          <span class="book-progress-track" aria-hidden="true"><span id="bookProgressFill"></span></span>
        </div>
        <button class="book-arrow book-next" id="nextPage" type="button" aria-label="Open sketchbook"><span id="nextLabel">Open book</span> <span aria-hidden="true">→</span></button>
      </div>
      <p class="book-instructions">Use the buttons, arrow keys, or swipe. Tap a painting to enlarge it.</p>
    </section>
  </main>

  <footer class="art-footer notebook-footer"><p>© Tia Martineau</p><a href="index.html">Back home</a></footer>

  <dialog class="painting-lightbox" id="paintingLightbox" aria-label="Enlarged artwork">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">×</button>
    <img id="lightboxImage" alt="">
  </dialog>

  <noscript><p class="noscript-notice">Enable JavaScript to explore the sketchbook.</p></noscript>
</body>
</html>
